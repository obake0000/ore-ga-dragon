const steps=[['start','開始'],['complete','完成'],['apply','適用'],['verify','検証'],['publish','公開']];
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const q=document.querySelector('#search'),f=document.querySelector('#filter'),root=document.querySelector('#content');
function groupFor(x){if(x.id.startsWith('park_'))return '廃園の追加作業';if(x.kind==='new')return '新しく作る素材';if(x.kind==='lineage_uncertain')return '生成元の確証待ち（現物あり）';return '再利用・完了・意図した表現';}
function render(){const query=q.value.trim().toLowerCase();const filter=f.value;const xs=plan.items.filter(x=>{const text=[x.id,x.name,x.where,x.make,x.reason].join(' ').toLowerCase();const okSearch=!query||text.includes(query);const okFilter=filter==='all'||x.kind===filter||(filter==='park'&&x.id.startsWith('park_'));return okSearch&&okFilter;});const counts=plan.counts;document.querySelector('#summary').innerHTML=`<span class="pill">${counts.unique_items}項目</span><span class="pill">新規制作 ${counts.new_work_items}項目（うち廃園 ${counts.park_added_model_work_items}）</span><span class="pill">再利用等 ${counts.reuse_or_complete}項目</span><span class="pill">由来確認待ち ${counts.existing_lineage_uncertain}項目・現物あり</span><span class="pill">${safe(counts.count_note)}</span>`;const groups=[...new Set(xs.map(groupFor))];root.innerHTML=groups.map(group=>`<section class="group"><h2>${safe(group)}</h2><div class="grid">${xs.filter(x=>groupFor(x)===group).map(x=>{const p=x.progress||{};return `<article class="card"><div class="id">${safe(x.id)}</div><h3>${safe(x.name)}</h3><div class="tags"><span class="tag ${x.kind==='new'?'new':x.kind==='lineage_uncertain'?'uncertain':'done'}">${safe(labels[x.kind]||x.kind)}</span>${x.assignment?`<span class="tag">担当: ${safe(x.assignment.owner)}</span>`:''}</div><p><span class="label">場所</span><br>${safe(x.where||'—')}</p><p><span class="label">作るもの・現在の内容</span><br>${safe(x.make||x.current||'—')}</p>${x.reason?`<p class="note">${safe(x.reason)}</p>`:''}<div class="status">${steps.map(([key,label])=>`<div><b>${label}</b>${safe(p[key]||'未確認')}</div>`).join('')}</div></article>`}).join('')}</div></section>`).join('')||'<p class="empty">該当する項目がありません。</p>';}
