<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#180b09">
<meta name="description" content="レッドドラゴンの物語と、さまざまなキャラで戦う無双編。">
<title>俺がドラゴン。｜ゲームを選ぶ</title>
<style>
*{box-sizing:border-box}
html{background:#180b09;color:#fff8ed;font-family:"Yu Gothic UI","Hiragino Sans",Meiryo,sans-serif}
body{margin:0}
main{min-height:100svh;max-width:1280px;margin:auto;padding:clamp(20px,4vw,56px);display:grid;grid-template-columns:minmax(0,1.3fr) minmax(290px,.7fr);gap:clamp(22px,4vw,56px);align-items:center}
.cover{display:block;width:100%;height:auto}
nav{display:grid;gap:14px}
.button{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px;padding:14px 20px;border:1px solid #a64b30;border-radius:6px;background:#a93419;color:white;text-decoration:none;font-size:clamp(1.1rem,2vw,1.4rem);font-weight:700}
.mode{font-size:.82rem;font-weight:600;white-space:nowrap}
.secondary{background:#33231f;border-color:#aa8a6b}
.button:hover{filter:brightness(1.15)}
.button:focus-visible{outline:3px solid #ffe098;outline-offset:4px}
@media(max-width:700px){main{max-width:520px;grid-template-columns:1fr;align-content:center;padding:18px;gap:22px}}
</style>
</head>
<body>
<main>
  <img class="cover" src="assets/cover.webp" width="1280" height="720" alt="俺がドラゴン。">
  <nav aria-label="ゲームを選ぶ">
    <a class="button" href="honpen.html?easy=1"><span>本編で遊ぶ</span><span class="mode">簡単モード ON</span></a>
    <a class="button secondary" href="musou.html">無双編で遊ぶ</a>
  </nav>
</main>
</body>
</html>
