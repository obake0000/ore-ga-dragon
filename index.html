function initMusic(){if(MUS||!AC)return;const comp=AC.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=4;comp.connect(master);
  const g=AC.createGain();g.gain.value=muted?0:0.55;g.connect(comp);MUS={g,song:'calm',step:0,bar:0,t:AC.currentTime+0.1};
  const ws=AC.createBufferSource();ws.buffer=NB;ws.loop=true;const wf=AC.createBiquadFilter();wf.type='bandpass';wf.Q.value=0.8;wf.frequency.value=500;const wg=AC.createGain();wg.gain.value=0;ws.connect(wf);wf.connect(wg);wg.connect(master);ws.start();WIND={f:wf,g:wg};

function musWant(){if(state==='play')return EN.some(e=>e.boss&&!e.dead)?'boss':'battle';if(state==='dead')return 'none';return 'calm';}
function musTick(){if(!MUS||!AC)return;const want=musWant();if(MUS.t<AC.currentTime-0.2){MUS.t=AC.currentTime+0.05;MUS.step=0;}
  let guard=0;while(MUS.t<AC.currentTime+0.18&&guard++<64){if(MUS.step%16===0&&MUS.song!==want){MUS.song=want;MUS.bar=0;}
    const S=SONGS[MUS.song],sp=S?60/S.bpm/4:0.1;if(S)musStep(S,MUS.step%16,MUS.bar,MUS.t,sp);
    MUS.t+=sp;MUS.step++;if(MUS.step%16===0)MUS.bar++;}}
function musStep(S,s,bar,t,sp){const [bs,cd]=S.ch[bar%4],dr=S.dr;
  if(dr){if(s===0||s===8||(dr===2&&(s===4||s===12))||(dr===1&&s===10&&bar%2))mKick(t);
    if(s===4||s===12)mSnare(t,0.45);if(dr===2&&s===15&&bar%2)mSnare(t,0.3);
    if(s%2===0)mHat(t,s%4===2?0.11:0.05);else if(dr===2)mHat(t,0.035);
    if(bar%4===3&&s>=12)mTom(t,mf(50-(s-12)*3));}
  if(dr===2){if(s%2===0)mBass(t,mf(bs+(s%8===6?12:0)),sp*1.8);}
  else if(dr===1){if(s===0||s===3||s===6||s===8||s===11||s===14)mBass(t,mf(bs+(s===14?12:0)),sp*2.5);}
  else if(s===0)mBass(t,mf(bs),sp*15,0.22);
  if(s===0)mPad(t,cd.map(mf),sp*16,dr?0.03:0.042);
  if(S.arp&&s%2===0)mPluck(t,mf(cd[(s/2)%cd.length]+(s>=8?12:0)),sp*3);
  if(S.mel&&s%2===0){const ph=S.mel[bar%S.mel.length],i=s/2,n=ph[i];if(n>0){let L=1;while(i+L<8&&ph[i+L]===0)L++;mBrass(t,mf(n),sp*2*L*0.95);}}}
function mVoice(t,du,pk,a){const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(pk,t+(a||0.005));g.gain.exponentialRampToValueAtTime(0.0001,t+du);g.connect(MUS.g);return g;}
function mOsc(t,du,ty,f0,f1,dst){const o=AC.createOscillator();o.type=ty;o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+du*0.6);o.connect(dst);o.start(t);o.stop(t+du+0.03);return o;}
function mNoise(t,du,ty,fr,dst){const s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type=ty;f.frequency.value=fr;s.connect(f);f.connect(dst);s.start(t,Math.random()*0.5);s.stop(t+du+0.02);}
function mKick(t){mOsc(t,0.3,'sine',150,42,mVoice(t,0.3,0.85));}
function mSnare(t,v){mNoise(t,0.18,'highpass',1500,mVoice(t,0.18,v));mOsc(t,0.1,'triangle',220,120,mVoice(t,0.1,v*0.6));}
function mHat(t,v){mNoise(t,0.045,'highpass',7500,mVoice(t,0.045,v,0.002));}
function mTom(t,fr){mOsc(t,0.26,'sine',fr*1.5,fr,mVoice(t,0.26,0.45));}
function mBass(t,fr,du,v){const g=mVoice(t,du,v||0.3,0.008);const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(900,t);f.frequency.exponentialRampToValueAtTime(220,t+du);f.connect(g);mOsc(t,du,'sawtooth',fr,0,f);}
function mPad(t,fs,du,v){const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.25);g.gain.setValueAtTime(v,t+du-0.3);g.gain.linearRampToValueAtTime(0.0001,t+du);g.connect(MUS.g);
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=1300;f.connect(g);fs.forEach(fr=>[-7,7].forEach(dt=>{const o=mOsc(t,du,'sawtooth',fr,0,f);o.detune.value=dt;}));}
function mPluck(t,fr,du){mOsc(t,du,'triangle',fr,0,mVoice(t,du,0.11,0.004));}
function mBrass(t,fr,du){const g=AC.createGain(),pk=0.1;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(pk,t+0.03);g.gain.setValueAtTime(pk*0.8,t+Math.max(0.05,du-0.06));g.gain.exponentialRampToValueAtTime(0.0001,t+du+0.08);g.connect(MUS.g);
  const f=AC.createBiquadFilter();f.type='lowpass';f.Q.value=2;f.frequency.setValueAtTime(700,t);f.frequency.exponentialRampToValueAtTime(3200,t+0.06);f.frequency.exponentialRampToValueAtTime(1500,t+0.3);f.connect(g);
  const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=5.5;lg.gain.value=6;lfo.connect(lg);lfo.start(t);lfo.stop(t+du+0.1);
  [0,7].forEach((dt,i)=>{const o=mOsc(t,du+0.08,i?'square':'sawtooth',fr,0,f);o.detune.value=dt;lg.connect(o.detune);});}

function wingPair(pts,m,sx){

function buildTown(cx,cz,R,S,o={}){
  const sp=o.special||{};const out={towers:[]};
  for(let i=-R;i<=R;i++)for(let j=-R;j<=R;j++){
    if(i===0||j===0)continue;if(Math.hypot(i,j)>R+0.6)continue;if(o.skip&&o.skip(i,j))continue;
    const x=cx+i*S+rnd(-1.2,1.2),z=cz+j*S+rnd(-1.2,1.2);
    const rot=Math.abs(i)<Math.abs(j)?(j>0?Math.PI:0):(i>0?-Math.PI/2:Math.PI/2);
    const k=i+','+j;if(sp[k]){sp[k](x,z,rot);continue;}
    const r=Math.random();
    if(r<0.42)makeHouse(x,z,rot);else if(r<0.8)makeHouse2(x,z,rot);else if(r<0.9)makeWarehouse(x,z,rot);else if(r<0.95)makeInn(x,z,rot);else makeSmithy(x,z,rot);
  }
  return out;
}

    g.font='bold 15px serif';g.textAlign='center';g.textBaseline='middle';const RN='ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛊᛏᛒᛖᛗᛚᛜᛞᛟ';for(let j=0;j<24;j++){g.save();g.rotate(j/24*Math.PI*2);g.fillText(RN[j],0,-110);g.restore();}
    for(let j=0;j<8;j++){const a=j/8*Math.PI*2;g.beginPath();g.arc(Math.cos(a)*62,Math.sin(a)*62,9,0,7);g.stroke();}}

  else if(kind==='vgrad'){const gr=g.createLinearGradient(0,0,0,256);gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(.12,'rgba(255,255,255,.95)');gr.addColorStop(.7,'rgba(255,255,255,.45)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,256,256);}
  else if(kind==='swirl'){for(let j=0;j<10;j++){const x=j*25.6,gr=g.createLinearGradient(0,0,0,256);gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(.5,'rgba(255,255,255,.95)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.beginPath();g.moveTo(x,256);g.lineTo(x+14,256);g.lineTo(x+44,0);g.lineTo(x+30,0);g.fill();}}
